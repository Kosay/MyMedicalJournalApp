name: Build Signed APK

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.14.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-install
          echo "/opt/gradle-install/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Debug keystore decoded from debug.keystore.base64"
          else
            echo "No debug.keystore.base64 found, using default debug keystore"
          fi

      - name: Verify Gradle version
        run: gradle --version

      - name: Probe available KSP versions
        run: |
          echo "=== KSP versions on Gradle Plugin Portal ==="
          curl -sL "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml" \
            | grep -oP '(?<=<version>)[^<]+' | sort -V | tail -20 \
            || echo "Gradle Plugin Portal fetch failed"
          echo "=== KSP versions on Google Maven ==="
          curl -sL "https://dl.google.com/dl/android/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml" \
            | grep -oP '(?<=<version>)[^<]+' | sort -V | tail -20 \
            || echo "Google Maven fetch failed"

      - name: Build signed debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    # Only run if the release keystore secrets are configured
    if: >
      vars.HAS_RELEASE_KEYSTORE == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.14.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-install
          echo "/opt/gradle-install/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Release keystore decoded"
          else
            echo "KEYSTORE_BASE64 secret not set — skipping release build"
            exit 1
          fi

      - name: Verify Gradle version
        run: gradle --version

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  # Convenience job: comment on the PR with direct download links to the APK artifacts
  notify-pr:
    name: Comment APK links on PR
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: always() && github.event_name == 'pull_request' && needs.build-debug.result == 'success'
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const releaseResult = '${{ needs.build-release.result }}';

            // Fetch this run's artifacts to build direct download links
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const linkFor = (prefix) => {
              const a = data.artifacts.find(a => a.name.startsWith(prefix));
              return a ? `${run_url}/artifacts/${a.id}` : null;
            };

            const debugLink = linkFor('debug-apk-');
            const releaseLink = linkFor('release-apk-');

            const lines = ['## APK Builds Ready', ''];

            if (debugLink) {
              lines.push(`**Debug APK (debug-signed):** [Download](${debugLink})`);
            } else {
              lines.push(`**Debug APK:** built — download from the [Actions run](${run_url}).`);
            }

            if (releaseResult === 'success' && releaseLink) {
              lines.push(`**Release APK (release-signed):** [Download](${releaseLink})`);
            } else if (releaseResult === 'success') {
              lines.push(`**Release APK:** built — download from the [Actions run](${run_url}).`);
            } else if (releaseResult === 'skipped') {
              lines.push('**Release APK:** skipped — to enable it, add the `KEYSTORE_BASE64`, `STORE_PASSWORD`, and `KEY_PASSWORD` repository secrets and set the `HAS_RELEASE_KEYSTORE` repository variable to `true` (Settings → Secrets and variables → Actions).');
            } else {
              lines.push(`**Release APK:** build failed — see the [Actions run](${run_url}) logs.`);
            }

            lines.push('', '_Download links require being signed in to GitHub with access to this repository. Artifacts expire after 7–14 days._');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: lines.join('\n')
            });
